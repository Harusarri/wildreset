plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.fabricmc.net/" }
	maven { url "https://maven.nucleoid.xyz/" }
	maven { url "https://api.modrinth.com/maven" }
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	include(implementation("net.kyori:adventure-api:4.24.0"))
	include(implementation("net.kyori:adventure-key:4.24.0"))
	include(implementation("net.kyori:adventure-text-minimessage:4.24.0"))
	include(implementation("net.kyori:adventure-text-serializer-gson:4.24.0"))
	include(implementation("net.kyori:adventure-text-serializer-json:4.24.0"))
	include(implementation("net.kyori:examination-api:1.3.0"))
	include(implementation("net.kyori:examination-string:1.3.0"))
	include(implementation("net.kyori:option:1.1.0"))

	compileOnly files("D:/mc-server/mods/ScalableLux-fabric-mc26.3-0.3.0-alpha.0.6-all.jar")
	compileOnly files("D:/mc-server/mods/yawp-26.3-fabric-0.6.3+haru.jar")
	compileOnly files("D:/mc-server/.fabric/processedMods/polymer-virtual-entity-0.18.3+26.3-35a5358e24ead9bf.jar")
	compileOnly files("D:/mc-server/.fabric/processedMods/polymer-core-0.18.3+26.3-19640d878b6e62e7.jar")
	compileOnly files("D:/mc-server/.fabric/processedMods/polymer-common-0.18.3+26.3-c44a79373f47c5e.jar")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
